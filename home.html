<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e0f2fe">
  <meta name="description" content="KingKongCoder is a local-first HTML, CSS and JavaScript studio. Create projects, edit files, upload assets and preview instantly.">
  <title>KingKongCoder - HTML / CSS / JS studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230284c7'/%3E%3Cpath d='M25 21 15 32l10 11M39 21l10 11-10 11' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-zone">
        <a class="brand" href="#/" aria-label="KingKongCoder home">
          <span class="brand-mark">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#38bdf8"/>
                  <stop offset="1" stop-color="#0369a1"/>
                </linearGradient>
              </defs>
              <rect width="32" height="32" rx="10" fill="url(#brand-gradient)"/>
              <path d="M12.4 10.7 7.6 16l4.8 5.3M19.6 10.7l4.8 5.3-4.8 5.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="16" cy="16" r="1.4" fill="#fff"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>KingKongCoder</strong>
            <small>HTML · CSS · JS</small>
          </span>
        </a>
      </div>
      <div class="topbar-center" id="topbar-center"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div class="toast-stack" id="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div class="mobile-scrim" id="mobile-scrim" hidden></div>

  <input type="file" id="file-input" multiple hidden>
  <input type="file" id="folder-input" webkitdirectory directory multiple hidden>

  <script src="templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
